<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KALEB CLUB</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>

    <style>
        body {
            background-color: #072746;
        }
        h1 {
            color: #1e548f;
        }
        #output {
            font-weight: bold;
            margin-top: 10px;
        }

    </style>


</head>
<body class="container mt-5">

    <div class="card p-4 shadow mx-auto" style="max-width: 500px;">

        <h1>KALEB CLUB MEMBERSHIP</h1>
        <p>Enter your first and last name to check if you are a member of the Kaleb Club.</p>

        <input type="text" id="first_name" class="form-control mb-3" placeholder="First Name">
        <input type="text" id="last_name" class="form-control mb-3" placeholder="Last Name">

        <button type="button" class="btn btn-success" py-click="check_member">CHECK</button>

        <h3 class="mt-4">Result</h3>
        <div id="output"></div>
        <p id="message"></p>

    </div>

    <py-script src="main.py"></py-script>

</body>
</html>
